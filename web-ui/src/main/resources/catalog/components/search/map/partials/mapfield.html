<div ol-map="map">
  <div class="btn-group gn-draw-btn" data-ng-if="relations">
    <button
      class="btn btn-default"
      gn-draw-bbox-btn="{{gnDrawBboxBtn}}"
      gn-draw-bbox-extent="{{gnDrawBboxExtent}}"
      gi-btn
      type="button"
      title="{{getButtonTitle()}}"
      aria-label="{{getButtonTitle()}}"
      data-ng-class="{active: interaction.active}"
      data-ng-model="interaction.active"
    >
      <i class="fa fa-pencil fa-fw" data-ng-hide="interaction.active"></i>
      <i class="fa fa-eraser fa-fw" data-ng-show="interaction.active"></i>
    </button>
    <button
      type="button"
      class="btn btn-default dropdown-toggle"
      type="button"
      title="{{'chooseSpatialFilterType' | translate}}"
      aria-label="{{'chooseSpatialFilterType' | translate}}"
      data-toggle="dropdown"
      aria-expanded="false"
    >
      <span class="caret"></span>
    </button>
    <ul class="dropdown-menu" role="menu">
      <li role="presentation" data-ng-class="{disabled : !searchObj.params.relation}">
        <a role="menuitem" ng-click="setRelation()" href="" translate=""
          >intersectWith
        </a>
      </li>
      <li
        data-ng-repeat="r in relations"
        role="presentation"
        data-ng-class="{disabled : searchObj.params.relation == r}"
      >
        <a role="menuitem" ng-click="setRelation(r)" href="">{{r | translate}} </a>
      </li>
    </ul>
  </div>

  <button
    data-ng-if="!relations"
    class="btn btn-default gn-draw-btn"
    gn-draw-bbox-btn="{{gnDrawBboxBtn}}"
    gn-draw-bbox-extent="{{gnDrawBboxExtent}}"
    gi-btn
    type="button"
    data-ng-model="interaction.active"
  >
    <i class="fa fa-pencil"></i>
  </button>
</div>
