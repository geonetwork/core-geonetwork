<div data-ng-show="uuid">
  <div data-ng-if="layout === 'select'">
    <label data-ng-if="metadataResources.length > 0" data-translate=""
      >filestoreChooseAFile</label
    >
    <select
      class="form-control"
      data-ng-if="metadataResources.length > 0"
      data-ng-model="selectOptions.current"
      data-ng-options="r as (r.id.split('/').splice(2).join('/') | decodeURIComponent) for r in metadataResources"
    ></select>
    <label data-translate="">filestoreUploadAFile</label><br />
    <div
      data-gn-data-uploader-button="'chooseOnlinesrc'"
      data-after-upload-cb="setResource"
      data-upload-options="filestoreUploadOptionsSetResource"
    ></div>

    <div data-gn-data-uploader-from-url="" data-after-upload-cb="setResource"></div>
  </div>
  <div data-ng-if="layout !== 'select'">
    <div
      class="alert alert-info"
      data-ng-show="filter && metadataResources.length === 0"
      data-translate=""
      data-translate-values="{filter: filter}"
    >
      fileStoreNoFileMatching
    </div>

    <a
      class="btn btn-default btn-xs pull-right"
      data-ng-show="metadataResources.length > 0"
      data-gn-click-and-spin="loadMetadataResources()"
    >
      <i class="fa fa-fw fa-refresh"></i>
    </a>

    <div class="gn-filestore-current-folder" data-ng-if="currentFolder && !isFiltered">
      <i class="fa fa-fw fa-folder-open-o"></i>
      <span data-translate="">fileStoreCurrentFolder</span>:
      <strong>{{currentFolder}}</strong>
    </div>

    <table class="table gn-data-store">
      <tbody>
        <tr data-ng-if="currentFolder && !isFiltered">
          <td colspan="10">
            <a
              href=""
              title="{{'fileStoreFolderUp' | translate}}"
              data-ng-click="openParentFolder()"
            >
              <i class="fa fa-fw fa-level-up"></i> ..
            </a>
          </td>
        </tr>
        <tr data-ng-repeat="folderName in currentFolders track by $index">
          <td colspan="10">
            <a
              href=""
              title="{{'fileStoreOpenFolder' | translate}}"
              data-ng-click="openFolder(folderName)"
            >
              <i class="fa fa-fw fa-folder-o"></i> {{folderName}}
            </a>
          </td>
        </tr>
        <tr data-ng-repeat="r in currentFiles track by $index">
          <td>
            <a
              href=""
              id="resource_{{$index}}"
              title="{{'clickToAddResource' | translate}}"
              data-ng-click="setResource(r)"
            >
              {{r._displayName}}
            </a>

            <div id="resource_edit_{{$index}}" class="hidden">
              <input
                type="text"
                name="fileName"
                class="form-control"
                data-ng-model="r.filename_edit"
                maxlength="255"
              />

              <a
                class="btn btn-link"
                title="{{'save' | translate}}"
                data-ng-click="saveEditResource(r, $index)"
                data-ng-disabled="r.filename_edit == r._renameOriginalLeaf"
              >
                <span class="fa fa-save"></span>
              </a>

              <a
                class="btn btn-link"
                title="{{'cancel' | translate}}"
                data-ng-click="cancelEditResource(r, $index)"
              >
                <span class="fa fa-cancel"></span>
              </a>

              <div
                data-ng-show="duplicatedFilename"
                data-translate=""
                class="alert alert-danger"
              >
                fileStoreDuplicatedFilename
              </div>
              <div
                data-ng-show="invalidFilename"
                data-translate=""
                class="alert alert-danger"
              >
                fileStoreInvalidFilename
              </div>
            </div>
          </td>
          <td data-ng-if="r.version.length > 0">{{r.version}}</td>
          <td
            data-ng-if="gnCurrentEdit.resourceManagementExternalProperties.enabled && r.metadataResourceExternalManagementProperties.url.length > 0"
          >
            <a
              class="btn btn-link"
              title="{{'externalResourceManagement' | translate}}"
              data-ng-click="onlinesrcService.openExternalResourceManagement(r)"
            >
              <span
                class="fa external-resource-validation-status-{{r.metadataResourceExternalManagementProperties.validationStatus | lowercase}}"
              ></span>
            </a>
          </td>
          <td>
            <a
              class="btn btn-link"
              title="{{'openResource' | translate}}"
              target="_blank"
              data-ng-href="{{onlinesrcService.getApprovedUrl(r.url)}}"
            >
              <i class="fa fa-eye"></i>
            </a>
          </td>
          <td>
            <a
              class="btn btn-link"
              title="{{'setResourceStatus' | translate}}"
              data-ng-click="setResourceStatus(r)"
            >
              <i
                class="fa"
                data-ng-class="{'fa-lock text-danger': r.visibility == 'PRIVATE',
                               'fa-lock-open text-success': r.visibility == 'PUBLIC'}"
              ></i>
            </a>
          </td>
          <td>
            <a
              class="btn btn-link"
              title="{{'renameResource' | translate}}"
              data-ng-click="editResource(r, $index)"
              data-ng-disabled="editingResource"
            >
              <i class="fa fa-edit"></i>
            </a>
          </td>
          <td>
            <a
              class="btn btn-link"
              title="{{'deleteResource' | translate}}"
              data-gn-confirm-click="{{'removeFileFromStoreConfirm' | translate:{url: r.url} }}"
              data-ng-click="deleteResource(r)"
            >
              <i class="fa fa-times text-danger"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="gn-filestore-new-folder form-inline">
      <input
        type="text"
        class="form-control"
        data-ng-model="newFolder.name"
        placeholder="{{'fileStoreNewFolderPlaceholder' | translate}}"
        maxlength="255"
      />
      <a
        class="btn btn-default"
        data-ng-disabled="!newFolder.name"
        data-ng-click="createFolder()"
      >
        <i class="fa fa-fw fa-folder-o"></i>
        <span data-translate="">fileStoreCreateFolder</span>
      </a>
      <div data-ng-show="newFolder.invalid" data-translate="" class="alert alert-danger">
        fileStoreInvalidFolderName
      </div>
    </div>

    <div
      data-gn-data-uploader-button="'chooseOnlinesrc'"
      data-after-upload-cb="linkUploadedFileToRecord"
      data-upload-options="filestoreUploadOptions"
      data-folder="{{currentFolder}}"
    ></div>

    <div
      data-gn-data-uploader-from-url=""
      data-after-upload-cb="linkUploadedFileToRecord"
      data-folder="{{currentFolder}}"
    ></div>
  </div>
</div>
