<div>
  <form class="form-horizontal" role="form" data-ng-search-form="">
    <input type="hidden" name="_csrf" value="{{csrf}}" />

    <div class="onlinesrc-container">
      <div class="form-group" data-ng-show="::config.sources.metadataStore">
        <label class="col-sm-2 control-label">
          <span
            >{{(config.sources.metadataStore.label || 'chooseACatalogRecord') |
            translate}}</span
          >
        </label>
        <div class="col-sm-10">
          <div class="input-group gn-margin-bottom" id="linktomd-search">
            <span class="input-group-addon"><i class="fa fa-search"></i></span>
            <input
              class="form-control"
              data-ng-change="updateParams();triggerSearch()"
              type="text"
              data-ng-model="searchObj.any"
              data-ng-model-options="modelOptions"
              autocomplete="off"
              placeholder="{{'anyPlaceHolder' | translate}}"
              aria-label="{{'anyPlaceHolder' | translate}}"
              autofocus=""
            />
          </div>

          <div data-ng-show="searchResults.records.length > 0">
            <div class="list-group fixed gn-nopadding-left gn-nopadding-right">
              <div class="list-group-item" data-ng-repeat="md in searchResults.records">
                <a
                  class="pull-right gn-margin-left-sm"
                  target="_blank"
                  href="catalog.search#/metadata/{{md.uuid}}"
                >
                  <span class="fa fa-eye" style="vertical-align: middle"></span
                ></a>
                <div
                  class="d-inline"
                  style="cursor: pointer"
                  data-ng-click="addToSelection(md)"
                >
                  {{md.resourceTitle}}
                  <div class="pull-right" data-ng-hide="isInSelection(md.uuid)">
                    <span class="fa fa-plus"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div
            data-ng-show="searchResults.records.length > 0"
            data-gn-pagination="paginationInfo"
            data-hits-values="searchObj.hitsperpageValues"
          ></div>
        </div>
      </div>

      <div
        class="form-group gn-nomargin-bottom"
        data-gn-doi-search-panel=""
        data-doi-url="config.sources['doiapi']['datacite'].url"
        data-doi-prefix="config.sources['doiapi'].prefix"
        data-doi-query-pattern="config.sources['doiapi']['datacite'].params.query"
        data-doi-crossref-url="config.sources['doiapi']['crossref'].url"
        data-doi-crossref-query-pattern="config.sources['doiapi']['crossref'].params.query"
        data-mode="{{multiple ? 'add' : 'select'}}"
        data-add-to-selection-cb="addToSelection(record)"
        data-remove-from-selection-cb="removeFromSelection(record)"
        data-ng-show="config.sources['doiapi']"
      ></div>

      <div
        data-gn-remote-record-selector=""
        data-ng-show="config.sources['remoteurl']"
      ></div>

      <div data-ng-if="selection.length > 0" class="form-group">
        <label class="col-sm-2 control-label">
          <span data-translate="">siblingListToAdd</span>
        </label>
        <div class="col-sm-10">
          <table class="table table-striped table-bordered">
            <tbody>
              <tr data-ng-repeat="md in selection">
                <td>{{md.resourceTitle || md.title}}</td>
                <td class="text-center">
                  <a
                    title="{{'removeFromSelection' | translate}}"
                    data-ng-click="removeFromSelection(md)"
                    href=""
                  >
                    <i class="fa fa-times text-danger"></i>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="">
      <button
        type="button"
        class="btn navbar-btn btn-success"
        data-gn-click-and-spin="linkToResource()"
        data-ng-disabled="!canEnableLinkButton(selection)"
      >
        <i class="fa gn-icon-{{mode}}"></i>
        <i class="icon-external-link"></i>&nbsp; {{btn.label || ('saveLinkToSibling' |
        translate)}}
      </button>
      <div data-gn-need-help="linking-records" class="pull-right"></div>
    </div>
  </form>
</div>
