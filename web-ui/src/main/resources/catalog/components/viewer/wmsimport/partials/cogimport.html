<form role="form" data-ng-submit="cogCtrl.addCog(cogUrl, map)">
  <!--Loaded on submit, not on change, to avoid range requests on a half-typed URL-->
  <div class="form-group" data-ng-class="{'has-error' : cogError}">
    <div class="input-group input-group-sm">
      <input
        id="gn-cog-url"
        class="form-control"
        placeholder="{{'COGfileURL'|translate}}"
        type="url"
        data-ng-model="cogUrl"
        data-ng-change="cogError = null"
      />
      <span class="input-group-btn">
        <button
          type="submit"
          class="btn btn-default"
          data-ng-disabled="!cogUrl || cogLoading"
        >
          <span
            class="fa"
            data-ng-class="cogLoading ? 'fa-spinner fa-spin' : 'fa-plus'"
            aria-hidden="true"
          ></span>
          {{'addToMap'|translate}}
        </button>
      </span>
    </div>
    <p class="help-block" role="alert" data-ng-if="cogError">{{cogError}}</p>
  </div>
</form>
