<div>
  <form
    class="ng-pristine ng-valid"
    role="form"
    data-ng-submit="kmlCtrl.addKml(url, map)"
  >
    <input type="hidden" name="_csrf" value="{{csrf}}" />
    <div class="form-group" data-ng-class="{'has-error' : kmlError}">
      <!--File URL-->
      <div class="input-group input-group-sm">
        <input
          class="form-control"
          aria-label="{{'KMLfileURL'|translate}}"
          placeholder="{{'KMLfileURL'|translate}}"
          type="url"
          data-ng-model="url"
          data-ng-change="kmlError = null"
        />
        <span class="input-group-btn">
          <button
            type="submit"
            class="btn btn-default"
            data-ng-disabled="!url || kmlLoading"
          >
            <span
              class="fa"
              data-ng-class="kmlLoading ? 'fa-spinner fa-spin' : 'fa-plus'"
              aria-hidden="true"
            ></span>
            {{'addToMap'|translate}}
          </button>
        </span>
      </div>
      <p class="help-block" role="alert" data-ng-if="kmlError">{{kmlError}}</p>

      <p>{{'or'|translate}}</p>

      <!--KMZ upload-->
      <div class="fu">
        <button type="button" class="btn btn-default">
          <span class="fa fa-upload"></span>
          {{'UploadKMZfile'|translate}}
        </button>
        <input
          class="form-control input-sm ng-pristine ng-valid"
          type="file"
          aria-label="{{'UploadKMZfile'|translate}}"
          accept="application/vnd.google-earth.kmz"
          id="kmz-file-input"
        />
      </div>
      <div class="list-group" id="file-list">
        <a
          href=""
          class="list-group-item"
          data-ng-repeat="e in kmzEntries"
          data-ng-click="onEntryClick(e, $event)"
        >
          <span
            class="pull-right"
            data-ng-class="{'fa fa-spinner fa-spin' : e.loading }"
          ></span>
          {{e.filename}}
        </a>
      </div>
    </div>
  </form>

  <div class="alert alert-warning" role="alert">
    <span class="fa fa-info-circle"></span>
    {{'msgCanDropFileOnMap'|translate}}
  </div>
</div>
